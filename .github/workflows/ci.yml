name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Starts the built app in demo mode and drives it end to end, on each system.
      - name: Smoke test (Linux needs a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
      - name: Smoke test
        if: runner.os != 'Linux'
        run: npm run smoke
